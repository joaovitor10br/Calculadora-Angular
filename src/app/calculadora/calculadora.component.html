<div class="container mt-5">
  <div class="card mx-auto" style="max-width: 400px;">
    <div class="card-header text-center">
      <h3>Calculadora</h3>
    </div>

    <div class="card-body">
      <!-- VISOR -->
      <input 
        type="text" 
        class="form-control mb-3 text-end" 
        [value]="visor" 
        readonly
      />

      <!-- BOTÕES -->
      <div class="d-grid gap-2 mb-2">
        <!-- Linha 1 -->
        <div class="row g-2 mb-2">
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('7')">7</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('8')">8</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('9')">9</button></div>
          <div class="col"><button class="btn btn-warning w-100" (click)="adicionar('/')">/</button></div>
        </div>

        <!-- Linha 2 -->
        <div class="row g-2 mb-2">
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('4')">4</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('5')">5</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('6')">6</button></div>
          <div class="col"><button class="btn btn-warning w-100" (click)="adicionar('*')">*</button></div>
        </div>

        <!-- Linha 3 -->
        <div class="row g-2 mb-2">
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('1')">1</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('2')">2</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('3')">3</button></div>
          <div class="col"><button class="btn btn-warning w-100" (click)="adicionar('-')">-</button></div>
        </div>

        <!-- Linha 4 -->
        <div class="row g-2">
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('0')">0</button></div>
          <div class="col"><button class="btn btn-secondary w-100" (click)="adicionar('.')">.</button></div>
          <div class="col"><button class="btn btn-success w-100" (click)="calcular()">=</button></div>
          <div class="col"><button class="btn btn-warning w-100" (click)="adicionar('+')">+</button></div>
        </div>
      </div>

      <!-- Botão Limpar -->
      <button class="btn btn-danger w-100" (click)="limpar()">C</button>
    </div>
  </div>
</div>
